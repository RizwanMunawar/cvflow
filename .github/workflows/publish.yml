name: Publish to PyPI

# Publishes CVFlow to PyPI when a GitHub Release is published.
# Authentication uses PyPI Trusted Publishing (OIDC): no API token or secret
# is stored in the repository. The matching pending publisher is configured on
# PyPI (project cvflow, this repo, workflow publish.yml, environment pypi).

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Verify package metadata
        run: |
          python -m pip install twine
          python -m twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # The `pypi` environment is named in the Trusted Publisher config on PyPI
    # and can carry extra protection rules (required reviewers, etc.).
    environment:
      name: pypi
      url: https://pypi.org/p/cvflow
    permissions:
      id-token: write # required for OIDC / Trusted Publishing
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
